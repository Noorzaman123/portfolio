<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Admin | Noor Zaman Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>
<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="hero-gradient-orb orb-1" style="top:-10%;left:-10%;width:500px;height:500px;"></div>
  <div class="hero-gradient-orb orb-2" style="bottom:-10%;right:-10%;width:400px;height:400px;"></div>

  <div class="login-card glass-card" data-aos="zoom-in" style="max-width:420px;width:100%;padding:2.5rem;">
    <div class="text-center mb-4">
      <div class="login-logo mb-3">
        <span class="brand-nz" style="font-size:2rem;">NZ</span>
      </div>
      <h1 class="h4 fw-bold">Admin Portal</h1>
      <p class="text-muted small">Sign in to manage your portfolio</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} glass-alert mb-3">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group-float mb-3">
        <input type="text" id="username" name="username" class="form-control-custom" placeholder=" " required autofocus />
        <label for="username"><i class="fas fa-user me-1"></i>Username</label>
      </div>

      <div class="form-group-float mb-3">
        <input type="password" id="password" name="password" class="form-control-custom" placeholder=" " required />
        <label for="password"><i class="fas fa-lock me-1"></i>Password</label>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me" />
          <label class="form-check-label text-muted small" for="remember_me">Remember me</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-glow w-100">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('main.index') }}" class="btn-text-link">
        <i class="fas fa-arrow-left me-1"></i>Back to Portfolio
      </a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
