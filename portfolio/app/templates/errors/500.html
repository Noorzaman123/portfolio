{% extends "base.html" %}
{% block title %}500 – Server Error | Noor Zaman{% endblock %}

{% block content %}
<section class="error-section d-flex align-items-center justify-content-center min-vh-100">
  <div class="container text-center" data-aos="zoom-in">
    <div class="error-code gradient-text">500</div>
    <h1 class="error-title">Server Error</h1>
    <p class="error-subtitle">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-glow mt-4">
      <i class="fas fa-home me-2"></i>Back to Home
    </a>
  </div>
</section>
{% endblock %}
